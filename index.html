<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Contact Form</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="sajjad-nav">
      <div class="brand">
        <img src="assests/favicon.png" alt="" />
        <span class="logo">Sajjad</span><span class="accent">Dev</span>
      </div>
      <div class="tagline">Frontend Developer</div>
    </nav>
    <div class="container">
      <form action="" class="form">
        <h1>Contact Us</h1>
        <label for="name">Name</label>
        <input type="text" autocomplete="off" id="name" />
        <div class="name-error"></div>
        <label for="email">Email</label>
        <input type="text" autocomplete="off" id="email" />
        <div class="email-error"></div>
        <label for="subject">Subject</label>
        <input type="text" autocomplete="off" id="subject" />
        <div class="subject-error"></div>
        <label for="message">Message</label>
        <textarea name="message" id="message"></textarea>
        <div class="message-error"></div>
        <button>Send</button>
        <div class="sent-message"></div>
      </form>
    </div>
    <script src="script.js"></script>
  </body>
</html>
